<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Apply the saved theme before first paint (no flash). src/theme.ts owns the toggle.
      (function () {
        var pref = 'auto';
        try { pref = localStorage.getItem('klondike-theme') || 'auto'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <title>Troop 455 Klondike Cart</title>
  </head>
  <body>
    <div id="app" data-mode="simple">
      <a class="skip-link" href="#simple-right">Skip to the safety result</a>
      <header class="topbar">
        <h1>Troop 455 Klondike Cart</h1>
        <span class="spacer"></span>
        <div class="mode-toggle" role="group" aria-label="View mode">
          <button id="mode-simple" type="button" aria-pressed="true">Simple</button>
          <button id="mode-advanced" type="button" aria-pressed="false">Advanced</button>
        </div>
        <button id="btn-theme" class="theme-toggle" type="button"></button>
        <button id="btn-copy-link" type="button" title="Copy a shareable link to this exact design">Copy link</button>
        <button id="btn-reset" type="button" title="Reset every parameter to its default">Reset<span class="long"> to defaults</span></button>
      </header>
      <div id="back-bar" class="back-bar" hidden>
        <button id="btn-back" type="button">← Back to the simple view</button>
      </div>
      <!-- DOM order = reading and focus order = the stacked phone order: viewer, safety result, controls (M10).
           On wide screens the grid areas place them left | viewer | right. -->
      <main id="viewer" class="viewer" aria-label="3D viewer"></main>
      <aside id="simple-right" class="sidebar" aria-label="Is it safe?" tabindex="-1"></aside>
      <aside id="simple-left" class="sidebar" aria-label="Change the cart"></aside>
      <aside id="params" class="sidebar left" aria-label="Parameters"></aside>
      <aside id="right" class="sidebar right" aria-label="Analysis"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
