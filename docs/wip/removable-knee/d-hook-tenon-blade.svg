<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dimarr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker><marker id="loadarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="bluearr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b6fb5"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9a77a" stroke-width="1"/></pattern></defs><rect width="1160" height="760" fill="#ffffff"/><text x="20" y="28" font-size="18" fill="#111" text-anchor="start" font-weight="bold">D: ways to drop the bottom pin (hook, tenon, blade). All three still need the top pin T</text><text x="20" y="48" font-size="12" fill="#444" text-anchor="start" font-weight="normal">Sections through the rail at x = 7.3" (looking aft, outboard to the right), 70 px = 1". Brake force on the knee: 152 lbf up, 126 lbf back, 3" outboard (a prying moment of 455 lbf-in).</text><text x="1140" y="28" font-size="11" fill="#666" text-anchor="end" font-weight="normal">Troop 455 Klondike sled: removable brake knee study</text><text x="20" y="92" font-size="12" fill="#111" text-anchor="start" font-weight="bold">D1  oak tenon from the knee's middle layer, in a mortise</text><clipPath id="clipD20"><rect x="20.0" y="110.0" width="322.0" height="448.0"/></clipPath><g clip-path="url(#clipD20)"><rect x="128.5" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="76.0" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="166.3" y="157.0" width="14.7" height="105.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="137.3" y="157.0" width="14.4" height="69.2" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="151.6" y="110.0" width="14.7" height="152.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="20.0" y="229.0" width="127.4" height="33.0" rx="0" fill="#d9cfb4" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="102.6" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">backer</text><text x="154.4" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rail</text><rect x="76.0" y="369.0" width="105.0" height="59.5" rx="0" fill="#fff" fill-opacity="1.0" stroke="#1b6fb5" stroke-width="1.5" stroke-dasharray="4 2"/><polygon points="181.0,472.0 303.5,472.0 303.5,157.0 335.0,124.0 181.0,124.0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><rect x="76.0" y="372.5" width="105.0" height="52.5" rx="0" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4"/><line x1="167.0" y1="278.0" x2="167.0" y2="369.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#loadarr)"/><line x1="90.0" y1="467.0" x2="90.0" y2="425.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#loadarr)"/><text x="177.5" y="264.0" font-size="9" fill="#c0392b" text-anchor="end" font-weight="normal">top wall pushes down</text><text x="97.0" y="481.0" font-size="9" fill="#c0392b" text-anchor="start" font-weight="normal">bottom wall pushes up</text></g><rect x="20.0" y="110.0" width="322.0" height="448.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><text x="390" y="92" font-size="12" fill="#111" text-anchor="start" font-weight="bold">D2  oak foot under the rail, lip behind the backer</text><clipPath id="clipD390"><rect x="390.0" y="110.0" width="322.0" height="448.0"/></clipPath><g clip-path="url(#clipD390)"><rect x="498.5" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="446.0" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="536.3" y="157.0" width="14.7" height="105.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="507.3" y="157.0" width="14.4" height="69.2" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="521.6" y="110.0" width="14.7" height="152.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="390.0" y="229.0" width="127.4" height="33.0" rx="0" fill="#d9cfb4" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="472.6" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">backer</text><text x="524.4" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rail</text><polygon points="551.0,472.0 673.5,472.0 673.5,157.0 705.0,124.0 551.0,124.0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><polygon points="407.5,507.0 551.0,507.0 551.0,472.0 442.5,472.0 442.5,436.9 407.5,436.9" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><line x1="502.0" y1="544.0" x2="502.0" y2="509.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#loadarr)"/><text x="502.0" y="549.0" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="normal">rail pushes foot down</text></g><rect x="390.0" y="110.0" width="322.0" height="448.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><text x="760" y="92" font-size="12" fill="#111" text-anchor="start" font-weight="bold">D3  1/4" stainless blade in a slot</text><clipPath id="clipD760"><rect x="760.0" y="110.0" width="322.0" height="448.0"/></clipPath><g clip-path="url(#clipD760)"><rect x="868.5" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="816.0" y="262.0" width="52.5" height="210.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="906.3" y="157.0" width="14.7" height="105.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="877.2" y="157.0" width="14.4" height="69.2" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="891.6" y="110.0" width="14.7" height="152.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="760.0" y="229.0" width="127.4" height="33.0" rx="0" fill="#d9cfb4" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="842.6" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">backer</text><text x="894.4" y="292.0" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rail</text><rect x="816.0" y="390.0" width="105.0" height="28.0" rx="0" fill="#fff" fill-opacity="1.0" stroke="#1b6fb5" stroke-width="1.5" stroke-dasharray="4 2"/><polygon points="921.0,472.0 1043.5,472.0 1043.5,157.0 1075.0,124.0 921.0,124.0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><rect x="921.0" y="390.0" width="105.0" height="28.0" rx="0" fill="#fff" fill-opacity="1.0" stroke="#1b6fb5" stroke-width="1.2" stroke-dasharray="3 2"/><rect x="819.5" y="395.6" width="206.5" height="18.9" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.4"/><text x="928.0" y="355.0" font-size="9" fill="#4f5964" text-anchor="middle" font-weight="normal">blade 1/4" x 1-1/2"</text></g><rect x="760.0" y="110.0" width="322.0" height="448.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><text x="20" y="600" font-size="11" fill="#222" text-anchor="start" font-weight="normal">D1 wood tenon: the load is UP, so it seats on the mortise top wall (good). But a tenon cannot pull the bottom of the knee inward, so the whole 455 lbf-in prying moment becomes a</text><text x="20" y="615" font-size="11" fill="#222" text-anchor="start" font-weight="normal">   couple on the tenon walls: 566 lbf at the root end on 0.71" x 0.4" of oak is 2,000 psi, 1.9x the 1,070 psi perpendicular-grain limit (1.3x even with 0.75" of contact). Fails.</text><text x="20" y="630" font-size="11" fill="#222" text-anchor="start" font-weight="normal">D2 foot and lip: seats the up-load, and the lip holds the bottom against prying (about 110 lbf, 410 psi cross-grain tension at the lip root; oak is weak there). But nothing holds it</text><text x="20" y="645" font-size="11" fill="#222" text-anchor="start" font-weight="normal">   fore and aft, so it swings on pin T; the foot is only the 0.71" middle layer (the outer layers' grain runs the wrong way); and it drops the knee 1/2" below the rail.</text><text x="20" y="660" font-size="11" fill="#222" text-anchor="start" font-weight="normal">D3 stainless blade: 1.5" wide it carries the same couple at 0.6 to 0.9 of the oak limit, with no wear, from a bought flat bar. It is the only one that works without a bottom pin, but it</text><text x="20" y="675" font-size="11" fill="#222" text-anchor="start" font-weight="normal">   needs a precise slot in the knee leg AND in the rail and backer, aligned to the top pin, for about the price of a second pin and sleeve. Not better than A.</text><rect x="20" y="721" width="14" height="10" fill="#e6c78e" stroke="#333" stroke-width="0.8"/><text x="39" y="730" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">white oak</text><rect x="100.0" y="721" width="14" height="10" fill="#d9dee3" stroke="#333" stroke-width="0.8"/><text x="119.0" y="730" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">stainless</text><rect x="180.0" y="721" width="14" height="10" fill="#f6ecd3" stroke="#333" stroke-width="0.8"/><text x="199.0" y="730" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">side web</text><rect x="254.0" y="721" width="14" height="10" fill="#fff" stroke="#333" stroke-width="0.8"/><text x="273.0" y="730" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">slot / mortise</text></svg>