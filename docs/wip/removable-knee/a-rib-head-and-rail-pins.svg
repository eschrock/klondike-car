ll="#111" text-anchor="start" font-weight="bold">ELEVATION</text><text x="950" y="84" font-size="11" fill="#111" text-anchor="start" font-weight="bold">DETAIL B-B at x = 5.6" (2x)</text><rect x="1034.6" y="96.0" width="14.8" height="648.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="1049.4" y="96.0" width="15.1" height="648.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="1064.5" y="96.0" width="15.1" height="28.8" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="981.0" y="111.8" width="53.6" height="504.7" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="927.0" y="400.6" width="54.0" height="216.0" rx="0" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="1064.5" y="268.8" width="72.0" height="172.8" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#1b6fb5" stroke-width="2"/><rect x="971.6" y="139.9" width="9.4" height="89.3" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.0"/><rect x="981.0" y="337.2" width="155.5" height="36.0" rx="0" fill="#c9d3dc" fill-opacity="1.0" stroke="#4f5964" stroke-width="1"/><rect x="968.0" y="341.7" width="212.4" height="27.0" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="1180.4" y="333.6" width="25.2" height="43.2" rx="0" fill="#fff" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><circle cx="968.0" cy="355.2" r="7.2" fill="#4f5964" stroke="#4f5964" stroke-width="1.0"/><text x="1079.6" y="146.4" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">D-ring bolt</text><text x="1079.6" y="168.0" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">washers above</text><text x="972.4" y="693.6" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">box tie</text><text x="1007.6" y="85.2" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rib head</text><text x="1094.0" y="470.4" font-size="10" fill="#1b6fb5" text-anchor="middle" font-weight="bold">tab</text><text x="1144.4" y="384.0" font-size="10" fill="#1b6fb5" text-anchor="middle" font-weight="bold">pin T</text><rect x="20" y="841" width="14" height="10" fill="#e6c78e" stroke="#333" stroke-width="0.8"/><text x="39" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">white oak</text><rect x="100.0" y="841" width="14" height="10" fill="#d9dee3" stroke="#333" stroke-width="0.8"/><text x="119.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">stainless</text><rect x="180.0" y="841" width="14" height="10" fill="#c9d3dc" stroke="#333" stroke-width="0.8"/><text x="199.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">sleeve / bushing</text><rect x="302.0" y="841" width="14" height="10" fill="#f6ecd3" stroke="#333" stroke-width="0.8"/><text x="321.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">side web</text><text x="20" y="874" font-size="11" fill="#222" text-anchor="start" font-weight="normal">T sits in the load line, on the rib head (4 through-bolts, tied to the storage box). B is a pin through the rail. Brake load 198 lbf: pin shear T 125 lbf, B 87 lbf.</text><text x="20" y="889" font-size="11" fill="#222" text-anchor="start" font-weight="normal">NDS single-shear capacity, wet: T (3/8" pin in 1/2" sleeves, 1" tab) 141 to 200 lbf = 0.62 to 0.89; B 183 to 260 lbf = 0.33 to 0.55. Tab clears the sign by 0.35" and the D-ring washers by 0.3".</text><text x="20" y="904" font-size="11" fill="#222" text-anchor="start" font-weight="normal">Pull both pins, lift the knee and flap off as one piece. What stays on the hull: two flush sleeves per side (and, optionally, the backer).</text></svg>