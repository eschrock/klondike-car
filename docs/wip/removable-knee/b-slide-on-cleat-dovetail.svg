<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="930" viewBox="0 0 1160 930" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dimarr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker><marker id="loadarr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="bluearr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b6fb5"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#b9a77a" stroke-width="1"/></pattern></defs><rect width="1160" height="930" fill="#ffffff"/><text x="20" y="28" font-size="18" fill="#111" text-anchor="start" font-weight="bold">B: slide-on bracket (French cleat or dovetail) with one lock pin</text><text x="20" y="48" font-size="12" fill="#444" text-anchor="start" font-weight="normal">B1 = a beveled cleat strip on the hull face. B2 = a dovetail socket in the rail that the knee's key slides up into. The brake load is UP, which unhooks a cleat and seats a dovetail.</text><text x="1140" y="28" font-size="11" fill="#666" text-anchor="end" font-weight="normal">Troop 455 Klondike sled: removable brake knee study</text><clipPath id="clipE"><rect x="30.0" y="92.0" width="576.0" height="694.8"/></clipPath><g clip-path="url(#clipE)"><rect x="30.0" y="776.0" width="576.0" height="10.8" rx="0" fill="#d8d2c4" fill-opacity="1.0" stroke="none" stroke-width="1.0"/><line x1="30.0" y1="776.0" x2="606.0" y2="776.0" stroke="#7a6f58" stroke-width="1.2"/><rect x="30.0" y="505.0" width="576.0" height="108.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="30.0" y="451.0" width="576.0" height="54.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="30.0" y="92.0" width="576.0" height="359.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="37.2" y="560.0" font-size="10" fill="#8a6a2f" text-anchor="start" font-weight="normal">rail 3/4" x 3"</text><text x="37.2" y="484.4" font-size="10" fill="#8a6a2f" text-anchor="start" font-weight="normal">chine band</text><text x="37.2" y="110.0" font-size="10" fill="#7d6a3a" text-anchor="start" font-weight="normal">side web (1/4" ply, 0.21" below the bands)</text><rect x="378.8" y="505.0" width="117.0" height="108.0" rx="0" fill="none" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1" stroke-dasharray="4 3"/><rect x="339.2" y="135.9" width="72.0" height="252.4" rx="0" fill="none" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.2" stroke-dasharray="5 3"/><rect x="361.6" y="280.3" width="27.0" height="108.0" rx="0" fill="none" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1" stroke-dasharray="3 2"/><rect x="345.0" y="150.0" width="60.5" height="44.6" rx="0" fill="none" fill-opacity="1.0" stroke="#8a8f96" stroke-width="1" stroke-dasharray="3 2"/><circle cx="353.3" cy="186.3" r="5.4" fill="#ececec" stroke="#8a8f96" stroke-width="0.8"/><circle cx="353.3" cy="186.3" r="13.5" fill="none" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="2 2"/><circle cx="397.2" cy="186.3" r="5.4" fill="#ececec" stroke="#8a8f96" stroke-width="0.8"/><circle cx="397.2" cy="186.3" r="13.5" fill="none" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="2 2"/><circle cx="353.3" cy="158.2" r="5.4" fill="#ececec" stroke="#8a8f96" stroke-width="0.8"/><circle cx="353.3" cy="158.2" r="13.5" fill="none" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="2 2"/><circle cx="397.2" cy="158.2" r="5.4" fill="#ececec" stroke="#8a8f96" stroke-width="0.8"/><circle cx="397.2" cy="158.2" r="13.5" fill="none" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="2 2"/><line x1="425.6" y1="488.0" x2="425.6" y2="262.3" stroke="#8a8f96" stroke-width="1" stroke-dasharray="6 3"/><text x="429.6" y="473.6" font-size="9" fill="#8a8f96" text-anchor="start" font-weight="normal">box fore end</text><text x="339.2" y="399.8" font-size="9" fill="#8a6a2f" text-anchor="start" font-weight="normal">rib head (inside)</text><text x="337.8" y="117.2" font-size="9" fill="#8a8f96" text-anchor="end" font-weight="normal">D-ring + 4 screws (inside)</text><rect x="30.0" y="159.7" width="297.0" height="165.2" rx="0" fill="#fff" fill-opacity="0.7" stroke="#8a8f96" stroke-width="1" stroke-dasharray="5 3"/><text x="181.2" y="174.8" font-size="10" fill="#8a8f96" text-anchor="middle" font-weight="normal">side sign</text><rect x="422.8" y="167.6" width="78.5" height="51.8" rx="0" fill="#f2c9c4" fill-opacity="1.0" stroke="#c0392b" stroke-width="1"/><text x="462.0" y="155.0" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="normal">reflector</text><rect x="506.3" y="185.2" width="99.7" height="80.3" rx="0" fill="#e8e8e8" fill-opacity="1.0" stroke="#8a8f96" stroke-width="1"/><text x="555.6" y="221.6" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">grab bd.</text><circle cx="174.0" cy="596.0" r="180.0" fill="#4a4d52" stroke="#222" stroke-width="1.5"/><circle cx="174.0" cy="596.0" r="50.4" fill="#9aa0a6" stroke="#222" stroke-width="1.0"/><text x="174.0" y="599.6" font-size="10" fill="#fff" text-anchor="middle" font-weight="normal">rear tire (outboard of the hull)</text><polygon points="30.0,379.2 455.2,355.0 455.2,323.5 30.0,347.7" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.2" stroke-linejoin="round"/><rect x="94.1" y="368.8" width="115.2" height="33.5" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="94.1" y="390.1" width="114.1" height="24.8" rx="0" fill="#222" fill-opacity="1.0" stroke="#000" stroke-width="1.0"/><text x="122.8" y="327.2" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">flap (runs on to the rear)</text><rect x="379.9" y="301.2" width="73.4" height="26.6" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/></g><rect x="30.0" y="92.0" width="576.0" height="684.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><polygon points="475.5,613.0 475.5,270.7 399.0,270.7 399.0,613.0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><line x1="424.5" y1="613.0" x2="424.5" y2="270.7" stroke="#8a6a2f" stroke-width="0.6" stroke-dasharray="2 2"/><line x1="450.0" y1="613.0" x2="450.0" y2="270.7" stroke="#8a6a2f" stroke-width="0.6" stroke-dasharray="2 2"/><rect x="399.0" y="297.7" width="59.5" height="63.9" rx="0" fill="none" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="399.0" y="270.0" width="72.0" height="119.3" rx="0" fill="#d9dee3" fill-opacity="0.82" stroke="#4f5964" stroke-width="1.2"/><circle cx="411.7" cy="375.1" r="3.0" fill="#fff" stroke="#4f5964" stroke-width="0.8"/><circle cx="411.7" cy="284.2" r="3.0" fill="#fff" stroke="#4f5964" stroke-width="0.8"/><circle cx="460.2" cy="375.1" r="3.0" fill="#fff" stroke="#4f5964" stroke-width="0.8"/><circle cx="460.2" cy="284.2" r="3.0" fill="#fff" stroke="#4f5964" stroke-width="0.8"/><circle cx="426.5" cy="329.6" r="6.8" fill="#fff" stroke="#4f5964" stroke-width="1.4"/><text x="426.5" y="313.6" font-size="9" fill="#222" text-anchor="middle" font-weight="normal">pivot pin</text><text x="436.8" y="396.2" font-size="9" fill="#4f5964" text-anchor="middle" font-weight="normal">strap</text><line x1="426.5" y1="329.6" x2="378.7" y2="272.3" stroke="#c0392b" stroke-width="2.4" marker-end="url(#loadarr)"/><text x="481.8" y="335.0" font-size="11" fill="#c0392b" text-anchor="start" font-weight="bold">198 lbf</text><text x="481.8" y="356.6" font-size="10" fill="#c0392b" text-anchor="start" font-weight="normal">up + back</text><text x="481.8" y="376.4" font-size="9" fill="#c0392b" text-anchor="start" font-weight="normal">(goal hold)</text><rect x="399.0" y="524.0" width="76.5" height="89.0" rx="0" fill="#fff" fill-opacity="0.35" stroke="#1b6fb5" stroke-width="2" stroke-dasharray="5 3"/><text x="436.8" y="515.6" font-size="9" fill="#1b6fb5" text-anchor="middle" font-weight="normal">B2 dovetail socket</text><clipPath id="clipS"><rect x="640.0" y="70.4" width="280.8" height="720.0"/></clipPath><g clip-path="url(#clipS)"><rect x="640.0" y="776.0" width="280.8" height="10.8" rx="0" fill="#d8d2c4" fill-opacity="1.0" stroke="none" stroke-width="1.0"/><line x1="640.0" y1="776.0" x2="920.8" y2="776.0" stroke="#7a6f58" stroke-width="1.2"/><rect x="771.4" y="416.0" width="126.0" height="360.0" rx="0" fill="none" fill-opacity="1.0" stroke="#8a8f96" stroke-width="1" stroke-dasharray="4 3"/><text x="834.4" y="668.0" font-size="10" fill="#8a8f96" text-anchor="middle" font-weight="normal">tire</text><text x="834.4" y="704.0" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">(x &lt; 5)</text><rect x="699.4" y="505.0" width="27.0" height="108.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="672.4" y="505.0" width="27.0" height="108.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="718.8" y="451.0" width="7.6" height="54.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="703.9" y="451.0" width="7.4" height="35.6" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="711.3" y="92.0" width="7.6" height="413.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="640.0" y="488.0" width="69.1" height="17.0" rx="0" fill="#d9cfb4" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="643.6" y="516.8" font-size="9" fill="#7d6a3a" text-anchor="start" font-weight="normal">deck</text><text x="686.1" y="624.8" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">backer</text><text x="712.7" y="624.8" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rail</text><text x="721.6" y="110.0" font-size="9" fill="#7d6a3a" text-anchor="start" font-weight="normal">web</text><line x1="726.4" y1="776.0" x2="726.4" y2="74.0" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="1 4"/><text x="726.4" y="65.0" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">hull face</text><polygon points="726.4,613.0 789.4,613.0 789.4,451.0 859.1,388.6 859.1,361.6 809.6,361.6 809.6,297.7 859.1,297.7 859.1,270.7 726.4,270.7" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><rect x="811.9" y="302.7" width="45.0" height="54.0" rx="0" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1"/><rect x="773.6" y="322.8" width="109.8" height="13.7" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="859.1" y="270.0" width="4.5" height="119.3" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="869.3" y="322.4" width="3.2" height="39.6" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="0.8"/><text x="773.2" y="254.0" font-size="10" fill="#222" text-anchor="middle" font-weight="normal">knee</text><line x1="834.4" y1="329.6" x2="834.4" y2="157.2" stroke="#c0392b" stroke-width="2.4" marker-end="url(#loadarr)"/><text x="834.4" y="151.2" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">152 up</text><line x1="726.4" y1="192.8" x2="859.1" y2="192.8" stroke="#555" stroke-width="0.8" marker-end="url(#dimarr)"/><line x1="859.1" y1="192.8" x2="726.4" y2="192.8" stroke="#555" stroke-width="0.8" marker-end="url(#dimarr)"/><text x="792.8" y="188.8" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">3.69" past the hull</text></g><rect x="640.0" y="92.0" width="280.8" height="684.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><polygon points="726.4,588.8 753.4,561.8 753.4,480.8 726.4,480.8" fill="#f0dcb0" fill-opacity="1.0" stroke="#1b6fb5" stroke-width="2" stroke-linejoin="round"/><text x="758.8" y="624.8" font-size="10" fill="#1b6fb5" text-anchor="start" font-weight="bold">B1 cleat strip</text><text x="758.8" y="639.2" font-size="9" fill="#1b6fb5" text-anchor="start" font-weight="normal">(3/4" proud, stays on)</text><text x="33.6" y="84.0" font-size="11" fill="#111" text-anchor="start" font-weight="bold">ELEVATION (B2 socket dashed blue)</text><text x="643.6" y="84.0" font-size="11" fill="#111" text-anchor="start" font-weight="bold">SECTION A-A (B1 cleat added)</text><text x="920" y="70" font-size="11" fill="#111" text-anchor="start" font-weight="bold">B2 PLAN at z = 6" (2.5x)</text><rect x="935.6" y="173.6" width="182.0" height="84.0" fill="#e6c78e" stroke="#8a6a2f"/><polygon points="981.0,173.6 1070.6,173.6 1093.0,246.4 958.6,246.4" fill="#ffffff" stroke="#1b6fb5" stroke-width="2"/><polygon points="985.5,173.6 1066.1,173.6 1088.5,240.8 963.1,240.8" fill="#f0dcb0" stroke="#8a6a2f" stroke-width="1.5"/><rect x="985.5" y="75.6" width="80.6" height="98.0" fill="#e6c78e" stroke="#8a6a2f"/><text x="1025.8" y="212.79999999999995" font-size="10" fill="#8a6a2f" text-anchor="middle" font-weight="normal">key</text><text x="1025.8" y="123.19999999999996" font-size="10" fill="#8a6a2f" text-anchor="middle" font-weight="normal">knee leg</text><text x="936.2" y="274.40000000000003" font-size="9" fill="#8a8f96" text-anchor="start" font-weight="normal">rail + backer: socket removes</text><text x="936.2" y="286.40000000000003" font-size="9" fill="#8a8f96" text-anchor="start" font-weight="normal">2.1" x 2.5" of the 3" rail depth</text><rect x="20" y="841" width="14" height="10" fill="#e6c78e" stroke="#333" stroke-width="0.8"/><text x="39" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">white oak</text><rect x="100.0" y="841" width="14" height="10" fill="#d9dee3" stroke="#333" stroke-width="0.8"/><text x="119.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">stainless</text><rect x="180.0" y="841" width="14" height="10" fill="#f6ecd3" stroke="#333" stroke-width="0.8"/><text x="199.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">side web</text><rect x="254.0" y="841" width="14" height="10" fill="#fff" stroke="#333" stroke-width="0.8"/><text x="273.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">socket (empty)</text><text x="20" y="874" font-size="11" fill="#222" text-anchor="start" font-weight="normal">B1: the strip stays on the hull, so it fails "nothing sticks out"; and the brake pulls the knee UP, which lifts a down-hooked cleat off.</text><text x="20" y="889" font-size="11" fill="#222" text-anchor="start" font-weight="normal">The one pin then carries 198 lbf in single shear: 1.1 to 1.5x its wet NDS capacity (129 to 183 lbf). Fails.</text><text x="20" y="904" font-size="11" fill="#222" text-anchor="start" font-weight="normal">B2: seated by the load (bearing on the closed top is 0.14 of the perpendicular-grain limit), but the socket removes most of the rail at x = 6 to 8.5,</text><text x="20" y="919" font-size="11" fill="#222" text-anchor="start" font-weight="normal">needs a dovetail bit, and an oak fit swells and binds in wet snow. Structurally fine, not practical.</text></svg>