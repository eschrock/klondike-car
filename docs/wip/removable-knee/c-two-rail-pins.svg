" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="738.8" y="451.0" width="7.6" height="54.0" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="723.9" y="451.0" width="7.4" height="35.6" rx="0" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.0"/><rect x="731.3" y="92.0" width="7.6" height="413.0" rx="0" fill="#f6ecd3" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><rect x="660.0" y="488.0" width="69.1" height="17.0" rx="0" fill="#d9cfb4" fill-opacity="1.0" stroke="#a58f5a" stroke-width="1.0"/><text x="663.6" y="516.8" font-size="9" fill="#7d6a3a" text-anchor="start" font-weight="normal">deck</text><text x="706.1" y="624.8" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">backer</text><text x="732.7" y="624.8" font-size="9" fill="#8a6a2f" text-anchor="middle" font-weight="normal">rail</text><text x="741.6" y="110.0" font-size="9" fill="#7d6a3a" text-anchor="start" font-weight="normal">web</text><line x1="746.4" y1="776.0" x2="746.4" y2="74.0" stroke="#8a8f96" stroke-width="0.6" stroke-dasharray="1 4"/><text x="746.4" y="65.0" font-size="9" fill="#8a8f96" text-anchor="middle" font-weight="normal">hull face</text><polygon points="746.4,613.0 809.4,613.0 809.4,451.0 879.1,388.6 879.1,361.6 829.6,361.6 829.6,297.7 879.1,297.7 879.1,270.7 746.4,270.7" fill="#e6c78e" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1.4" stroke-linejoin="round"/><rect x="831.9" y="302.7" width="45.0" height="54.0" rx="0" fill="#f0dcb0" fill-opacity="1.0" stroke="#8a6a2f" stroke-width="1"/><rect x="793.6" y="322.8" width="109.8" height="13.7" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="879.1" y="270.0" width="4.5" height="119.3" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="889.3" y="322.4" width="3.2" height="39.6" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="0.8"/><text x="793.2" y="254.0" font-size="10" fill="#222" text-anchor="middle" font-weight="normal">knee</text><line x1="854.4" y1="329.6" x2="854.4" y2="157.2" stroke="#c0392b" stroke-width="2.4" marker-end="url(#loadarr)"/><text x="854.4" y="151.2" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="bold">152 up</text><line x1="746.4" y1="192.8" x2="879.1" y2="192.8" stroke="#555" stroke-width="0.8" marker-end="url(#dimarr)"/><line x1="879.1" y1="192.8" x2="746.4" y2="192.8" stroke="#555" stroke-width="0.8" marker-end="url(#dimarr)"/><text x="812.8" y="188.8" font-size="10" fill="#555" text-anchor="middle" font-weight="normal">3.69" past the hull</text></g><rect x="660.0" y="92.0" width="280.8" height="684.0" rx="0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="0.8"/><rect x="692.4" y="579.8" width="117.0" height="18.0" rx="0" fill="#c9d3dc" fill-opacity="1.0" stroke="#4f5964" stroke-width="1"/><rect x="685.2" y="582.0" width="153.0" height="13.5" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="838.2" y="578.0" width="12.6" height="21.6" rx="0" fill="#fff" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="692.4" y="518.6" width="117.0" height="18.0" rx="0" fill="#c9d3dc" fill-opacity="1.0" stroke="#4f5964" stroke-width="1"/><rect x="685.2" y="520.8" width="153.0" height="13.5" rx="0" fill="#d9dee3" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><rect x="838.2" y="516.8" width="12.6" height="21.6" rx="0" fill="#fff" fill-opacity="1.0" stroke="#4f5964" stroke-width="1.2"/><text x="33.6" y="84.0" font-size="11" fill="#111" text-anchor="start" font-weight="bold">ELEVATION</text><text x="663.6" y="84.0" font-size="11" fill="#111" text-anchor="start" font-weight="bold">SECTION A-A at x = 7.3"</text><rect x="20" y="841" width="14" height="10" fill="#e6c78e" stroke="#333" stroke-width="0.8"/><text x="39" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">white oak</text><rect x="100.0" y="841" width="14" height="10" fill="#d9dee3" stroke="#333" stroke-width="0.8"/><text x="119.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">stainless</text><rect x="180.0" y="841" width="14" height="10" fill="#c9d3dc" stroke="#333" stroke-width="0.8"/><text x="199.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">sleeve / bushing</text><rect x="302.0" y="841" width="14" height="10" fill="#f6ecd3" stroke="#333" stroke-width="0.8"/><text x="321.0" y="850" font-size="10.5" fill="#333" text-anchor="start" font-weight="normal">side web</text><text x="20" y="874" font-size="11" fill="#222" text-anchor="start" font-weight="normal">The rail is only 3" deep, so the pins cannot sit more than 1.7" apart while the load acts 5.5" above them.</text><text x="20" y="889" font-size="11" fill="#222" text-anchor="start" font-weight="normal">A loose pin is not a clamped bolt. The worst pin sees 516 lbf; its wet NDS single-shear capacity is 158 to 225 lbf bare, 210 to 300 lbf in 1/2" sleeves (1.7 to 2.5x over).</text><text x="20" y="904" font-size="11" fill="#222" text-anchor="start" font-weight="normal">Two 1/2" pins in 5/8" sleeves: 1.4 to 2.0x. Four 3/8" pins on today's bolt pattern, sleeved: 0.85 to 1.21x. Axial pull (yaw and prying) is about 260 lbf per pin.</text></svg>